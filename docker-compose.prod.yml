# Single-server production (e.g. one small EC2 instance): Postgres + app + Caddy (automatic HTTPS) + daily backups.
#   cp apps/api/.env.example apps/api/.env   # set JWT_SECRET, PUBLIC_URL and any provider keys
#   DOMAIN=app.example.com docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app npx tsx src/seed.ts   # optional demo data (wipes DB)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meyra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meyra}
      POSTGRES_DB: meyra
    volumes:
      - pg:/var/lib/postgresql/data
    restart: unless-stopped
    # Keep Postgres small on a 1 GB server.
    command: postgres -c shared_buffers=64MB -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meyra"]
      interval: 10s
      retries: 10

  app:
    build: .
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://meyra:${DB_PASSWORD:-meyra}@db:5432/meyra
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the site hostname}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:4000
    volumes:
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

  # Daily compressed database dump, last 7 days kept.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD:-meyra}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U meyra meyra | gzip > /backups/meyra-$$(date +%F).sql.gz;
        find /backups -name "meyra-*.sql.gz" -mtime +7 -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg:
  uploads:
  caddy_data:
